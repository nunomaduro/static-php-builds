name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: PHP branch or version (e.g. 8.5, 8.5.10 or 8.6.0RC1), "all" for every branch, or empty for every missing release.
        required: false
        type: string
      publish:
        description: Publish a GitHub release. Off only builds and tests.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: scripts/plan-releases.sh "$REQUESTED_VERSION" >>"$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.release.version }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
        platform: [linux-x86_64, linux-aarch64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
    env:
      PHP_VERSION: ${{ matrix.release.version }}
      PHP_SHA256: ${{ matrix.release.sha256 }}
      PHP_SOURCE_URL: ${{ matrix.release.url }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore libraries
        id: libraries
        if: ${{ !inputs.publish }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/${{ matrix.platform }}/buildroot
            .build/${{ matrix.platform }}/downloads
            .build/${{ matrix.platform }}/pkgroot
          key: libraries-${{ matrix.platform }}-${{ hashFiles('config/build.env', 'config/extensions.txt', 'config/sources.lock', 'patches/**') }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build.sh "$PHP_VERSION" "$PHP_SHA256" "$PLATFORM" "$PHP_SOURCE_URL"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.release.version }}-${{ matrix.platform }}
          path: .build/${{ matrix.platform }}/log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save libraries
        if: ${{ !inputs.publish && steps.libraries.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/${{ matrix.platform }}/buildroot
            .build/${{ matrix.platform }}/downloads
            .build/${{ matrix.platform }}/pkgroot
          key: ${{ steps.libraries.outputs.cache-primary-key }}

      - name: Smoke test
        run: scripts/smoke-test.sh "dist/php-$PHP_VERSION-$PLATFORM.tar.gz" "$PHP_VERSION"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.release.version }}-${{ matrix.platform }}
          path: dist/php-${{ matrix.release.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish PHP ${{ matrix.release.version }}
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its files
      id-token: write # sign the build provenance attestation
      attestations: write # store the build provenance attestation
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      PHP_VERSION: ${{ matrix.release.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-${{ matrix.release.version }}-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: scripts/write-checksums.sh "$PHP_VERSION" dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/php-${{ matrix.release.version }}-*.tar.gz
            dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$PHP_VERSION" dist
